name: Deploy release dist to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Full release tag to deploy (for example, 2-10-2026-v1.0)
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish the tagged production dist
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^[0-9]+-[0-9]+-[0-9]{4}-v[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            echo "Expected a tag such as 2-10-2026-v1.0" >&2
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Download the production dist attached to this release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p "$RUNNER_TEMP/release" "$RUNNER_TEMP/pages-site"
          gh release download "$RELEASE_TAG" --repo "$REPOSITORY" --pattern byr-dist.tar.gz --dir "$RUNNER_TEMP/release"
          tar -xzf "$RUNNER_TEMP/release/byr-dist.tar.gz" -C "$RUNNER_TEMP/pages-site"
          test -s "$RUNNER_TEMP/pages-site/index.html"

      - name: Upload release dist to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pages-site

      - name: Deploy the release artifact
        id: deployment
        uses: actions/deploy-pages@v4
